<div class="ui middle aligned center aligned grid login-page">

    <div class="sixteen wide column login-column">

        <div class="ui raised segment login-card">

            <div class="login-header">

                <i class="graduation cap huge icon"></i>

                <h2 class="ui header">
                    AcademiaHub
                    <div class="sub header">
                        Sistema de Gestión Académica
                    </div>
                </h2>

            </div>

            <div class="ui divider"></div>

            <h3 class="ui header">
                Iniciar sesión
            </h3>

            <p class="login-description">
                Ingresa tus credenciales para continuar.
            </p>

            <form class="ui large form" (ngSubmit)="iniciarSesion()" #loginForm="ngForm">

                <!-- Correo electrónico -->
                <div class="field">

                    <label>Correo electrónico</label>

                    <div class="ui left icon input">
                        <input type="email" name="correo" placeholder="usuario@unaula.edu.co"
                            [(ngModel)]="credentials.correo" required email autocomplete="username">
                        <i class="user icon"></i>
                    </div>

                </div>

                <!-- Contraseña -->
                <div class="field">

                    <label>Contraseña</label>

                    <div class="ui left icon input">
                        <input type="password" name="password" placeholder="Ingresa tu contraseña"
                            [(ngModel)]="credentials.password" required autocomplete="current-password">
                        <i class="lock icon"></i>
                    </div>

                </div>

                <!-- Mensaje de error -->
                <div class="ui negative message" [hidden]="!errorMessage">

                    <i class="close icon"></i>

                    <div class="header">
                        Error de autenticación
                    </div>

                    <p>{{ errorMessage }}</p>

                </div>

                <!-- Botón -->
                <button class="ui fluid large primary button" type="submit" [disabled]="loginForm.invalid || loading">

                    <i class="sign in alternate icon" [hidden]="loading">
                    </i>

                    <span [hidden]="loading">
                        Ingresar
                    </span>

                    <span [hidden]="!loading">
                        Validando credenciales...
                    </span>

                </button>

            </form>

            <div class="ui divider"></div>

            <div class="login-footer">
                <small>
                    AcademiaHub © 2026
                </small>
            </div>

        </div>

    </div>

</div>
